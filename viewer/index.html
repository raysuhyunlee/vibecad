      <symbol id="i-op-knurl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v13a7 2.5 0 0 0 14 0v-13M5 12l6 6.5M5 8l10 10.5M9 8.5l10 9M14 8.5l5 4.5M19 12l-6 6.5M19 8 9 18.5M15 8.5 5 17.5M10 8.5 5 13"/></symbol>
      <symbol id="i-op-thread" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v18M16 3v18M8 7l8-3M8 11l8-3M8 15l8-3M8 19l8-3"/></symbol>

      <symbol id="i-op-union" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h12v6h6v12H9v-6H3Z" fill="currentColor" fill-opacity=".3"/></symbol>
      <symbol id="i-op-cut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h12v6H9v6H3Z" fill="currentColor" fill-opacity=".3"/><path d="M9 9h12v12H9Z" stroke-dasharray="2 2.5"/></symbol>
      <symbol id="i-op-intersect" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h12v12H3ZM9 9h12v12H9Z" stroke-dasharray="2 2.5"/><path d="M9 9h6v6H9Z" fill="currentColor" fill-opacity=".45"/></symbol>
      <symbol id="i-op-fillet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11a7 7 0 0 1 7-7h9"/><path d="M4 8V4h4" stroke-dasharray="2 2.5"/></symbol>
      <symbol id="i-op-chamfer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11l7-7h9"/><path d="M4 8V4h4" stroke-dasharray="2 2.5"/></symbol>
      <symbol id="i-op-shell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v17h18V4M7 4v13h10V4"/></symbol>
      <symbol id="i-op-translate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></symbol>
      <symbol id="i-op-rotate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>

      <symbol id="i-op-importStep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6Z"/><path d="M14 3v5h5M12.5 11v6M9.5 14l3 3 3-3"/></symbol>

      <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></symbol>

  </svg>

  <div id="app">
    <aside id="design" aria-label="Design">
      <section id="files" aria-label="Project files" hidden>
        <header>
          <span id="project-name" class="name"></span>
          <button id="new-file" class="icon" aria-label="New file" title="New file"><svg><use href="#i-plus"/></svg></button>
          <button id="open-project" class="icon" aria-label="Open project" title="Open project"><svg><use href="#i-folder"/></svg></button>
        </header>
        <form id="new-file-form" hidden>
          <input id="new-file-name" placeholder="name or folder/name" aria-label="New file name" spellcheck="false" autocomplete="off">
          <div id="new-file-error" role="alert" hidden></div>
        </form>
        <div id="tree"></div>
      </section>
      <section id="joints" hidden></section>
      <section id="source" hidden></section>
      <section id="checks" hidden></section>
    </aside>

    <div id="center">
    <div id="tabs" role="tablist" aria-label="Open files" hidden></div>
    <main id="stage">
      <div id="viewport"></div>
      <canvas id="ink"></canvas>
      <div id="pins"></div>
      <nav id="parts" aria-label="Model tree" hidden></nav>
      <section id="gallery" aria-label="Reference images" hidden>
        <div id="strip">
          <button id="all-photos" type="button" class="icon" aria-label="All images" title="All images"><svg><use href="#i-grid"/></svg></button>
          <div id="strip-list"></div>
        </div>
        <div id="grid"></div>
        <div id="photo" hidden>
          <img id="photo-img" alt="">
          <svg id="photo-svg"></svg>
          <div id="photo-labels"></div>
        </div>
      </section>
      <input id="photo-file" type="file" accept="image/*" multiple hidden>
      <div id="photo-bar" hidden>
        <div class="segmented" role="group" aria-label="View">
          <button id="show-model" type="button" aria-pressed="true" title="Model (I)">Model</button>
          <button id="show-images" type="button" aria-pressed="false" title="Images (I)">Images</button>
        </div>
        <button id="photo-send" type="button" class="button primary" hidden>Update model</button>
      </div>
      <div id="tip" hidden></div>
      <div id="banner" role="alert" hidden></div>
      <div id="empty">
        <button id="open-first" class="button primary"><svg><use href="#i-folder"/></svg>Open project</button>
        <div id="empty-file" hidden>
          <span>This file is empty. Add a photo or sketch to model it, or describe the part in the chat.</span>
          <button id="empty-photo" class="button primary"><svg><use href="#i-plus"/></svg>Add photo or sketch</button>
        </div>
        <span id="empty-text" hidden></span>
      </div>
      <canvas id="gizmo" aria-label="View cube"></canvas>
      <div id="measure" aria-live="polite" hidden></div>
      <div id="tools">
        <button id="draw" class="icon" aria-label="Draw (D)" aria-pressed="false" title="Draw (D)"><svg><use href="#i-pen"/></svg></button>
        <button id="fit" class="icon" aria-label="Fit view (F)" title="Fit view (F)"><svg><use href="#i-fit"/></svg></button>
      </div>
    </main>
    </div>

    <aside id="chat" aria-label="Conversation">
      <header>
        <button id="agent" type="button" class="button" aria-haspopup="menu" aria-expanded="false" hidden><span id="agent-name"></span><svg><use href="#i-chevron"/></svg></button>
        <span class="spacer"></span>
        <button id="open-history" class="icon" aria-label="Past sessions" title="Past sessions"><svg><use href="#i-history"/></svg></button>
        <button id="new-session" class="icon" aria-label="New session" title="New session"><svg><use href="#i-plus"/></svg></button>
      </header>
      <div id="no-agent" hidden>
        <p>No agent CLI found. Install one, log in to it, then check again.</p>
        <div id="no-agent-list"></div>
        <button id="agents-check" type="button" class="button">Check again</button>
        <div id="no-agent-error" role="alert" hidden></div>
      </div>
      <div id="log" aria-live="polite"></div>
      <form id="composer">
        <div id="added"></div>
        <div id="refs"></div>
        <div id="queued" hidden></div>
        <textarea id="input" rows="2" placeholder="Pin the model with the pen (D), then describe the change" aria-label="Feedback"></textarea>
        <div id="actions">
          <button id="mic" type="button" class="icon" aria-label="Talk (hold Space)" title="Talk (hold Space)"><svg><use href="#i-mic"/></svg></button>
          <button id="send" type="submit" class="icon primary" aria-label="Send" title="Send"><svg><use href="#i-send"/></svg></button>
        </div>
        <div id="mic-error" role="alert" hidden></div>
      </form>
    </aside>
  </div>
  <dialog id="picker" aria-label="Open project">
    <form id="picker-form">
      <button id="picker-up" type="button" class="icon" aria-label="Parent folder" title="Parent folder"><svg><use href="#i-up"/></svg></button>
      <input id="picker-path" aria-label="Folder path" spellcheck="false" autocomplete="off">
      <button id="picker-close" type="button" class="icon" aria-label="Close" title="Close"><svg><use href="#i-x"/></svg></button>
    </form>
    <div id="picker-list"></div>
    <footer>
      <div id="picker-error" role="alert" hidden></div>
      <button id="picker-open" type="button" class="button primary">Open</button>
    </footer>
  </dialog>
  <dialog id="history" class="sheet" aria-label="Past sessions">
    <header>
      <span class="name">Past sessions</span>
      <button id="history-close" type="button" class="icon" aria-label="Close" title="Close"><svg><use href="#i-x"/></svg></button>
    </header>
    <div id="history-list"></div>
    <div id="history-error" role="alert" hidden></div>
  </dialog>
  <div id="agent-menu" class="menu" role="menu" hidden></div>
  <div id="file-menu" role="menu" hidden>
    <button type="button" class="row" role="menuitem" data-format="step">Export STEP</button>
    <button type="button" class="row" role="menuitem" data-format="stl">Export STL</button>
  </div>
  <script type="module" src="/viewer/main.js"></script>
</body>
</html>
