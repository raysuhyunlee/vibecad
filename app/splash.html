<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Vibecad</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #20251f; }
    body { -webkit-app-region: drag; }
    #version { position: fixed; left: 16px; bottom: 12px; font: 12px -apple-system, system-ui, sans-serif; color: rgba(255, 255, 255, 0.5); }
    img { display: block; width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body aria-label="Starting Vibecad" aria-busy="true">
  <img src="./assets/splash.png" alt="vibecad" draggable="false">
  <div id="version"></div>
  <script src="./splash.js"></script>
</body>
</html>
